[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = arduino
; NRF24 kütüphanesini otomatik indirmesi için:
lib_deps = 
    nrf24/RF24 @ ^1.4.8
    miguelbalboa/MFRC522 @ ^1.4.10
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit SSD1306 @ ^2.5.10
; USB üzerinden Serial Monitor kullanmak istiyorsanız (BluePill'in kendi USB portu):
build_flags = 
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON

; Eğer ST-Link kullanıyorsanız aşağıdaki satırı açın:
upload_protocol = stlink
#upload_flags = -c set CPUTAPID 0x2ba01477