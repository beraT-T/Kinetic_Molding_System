; ============================================================
;  ADAPTIF KALIP v5  --  U2 KARTI (5 MOTOR, motor 1-5)
;  Isci dugum: sadece USART2 ile U3'e baglidir, RS485 yok.
;  Kart F411CEU6 ise bu projeyi KULLANMA, sadece board satirini degistirmek YETMEZ
;  (flash sektor haritasi/SETID ve saat farkli): Adaptif_kalip_v5f411_U2_5motor/ ve
;  V5F411_NOTU.md. Not: v5f411 klasorleri su an Git'te takip edilmiyor.
; ============================================================
[env:genericSTM32F401RC]
platform = ststm32
board = genericSTM32F401RC
framework = arduino
upload_protocol = stlink
monitor_speed = 115200
build_flags =
    -D HSE_VALUE=25000000U
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
