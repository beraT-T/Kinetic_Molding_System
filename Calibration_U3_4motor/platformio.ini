; ============================================================
;  KALIBRASYON / DONANIM TESTI - U3 (4 MOTOR, motor 6-9)
; ------------------------------------------------------------
;  Bu proje SADECE donanim testi icindir. Calisan firmware'i
;  degistirmez. ST-Link ile yukle, kartin USB'sini bilgisayara
;  tak, seri monitoru 115200'de ac ve komutlari yaz.
;
;  NOT: Kartin gercekten F411 ise asagidaki board satirini
;       "genericSTM32F411RE" / "blackpill_f411ce" ile degistir.
;       Mevcut calisan kodla ayni kalsin diye F401RC birakildi.
; ============================================================
[env:genericSTM32F401RC]
platform = ststm32
board = genericSTM32F401RC
framework = arduino
upload_protocol = stlink
monitor_speed = 115200
build_flags =
    -D HSE_VALUE=25000000U
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
