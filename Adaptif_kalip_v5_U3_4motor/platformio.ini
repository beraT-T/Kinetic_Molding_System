; ============================================================
;  ADAPTIF KALIP v5  --  U3 KARTI (4 MOTOR, motor 6-9)
;  Yonetici dugum: PC->F103->RS485->U3, ve U3->USART2->U2.
;  Kart F411CEU6 ise bu projeyi KULLANMA, sadece board satirini degistirmek YETMEZ
;  (flash sektor haritasi/SETID ve saat farkli): Adaptif_kalip_v5f411_U3_4motor/ ve
;  V5F411_NOTU.md. Not: v5f411 klasorleri su an Git'te takip edilmiyor.
; ============================================================
[env:genericSTM32F401RC]
platform = ststm32
board = genericSTM32F401RC
framework = arduino
upload_protocol = stlink
monitor_speed = 115200
build_flags =
    -D HSE_VALUE=25000000U
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
